[project]
name = "barcelona-de-indias-time-serie"
version = "0.1.0"
description = "Análisis conjunto de series de tiempo meteorológicas (IDEAM) e índices de vegetación satelitales para la laguna de Barcelona de Indias (Cartagena)."
requires-python = ">=3.12"
dependencies = [
    "folium>=0.17",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "matplotlib>=3.9",
    "nbconvert>=7.16",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.14",
    "statsmodels>=0.15.0",
    "torch>=2.14.0",
    "xgboost>=3.4.1",
]

[tool.uv]
package = false
